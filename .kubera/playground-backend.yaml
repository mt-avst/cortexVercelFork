teamName: platform #Mandatory field
environment: playground
service:
  port: 3001
# Private ingress: the backend is NOT exposed to the public internet. Declaring
# service.port above (with no ingress block) gives it a private ClusterIP only.
# Browser and webhook traffic reach it via the frontend nginx proxy, which forwards
# /api and /auth to adaptalabs-backend.adaptalabs.svc.cluster.local:3001.
config:
  data:
    NODE_ENV: production
    # Verify the database server certificate on every backend pool AND the
    # deploy initContainer's migration runner. The trust store is baked into
    # the image at backend/certs/rds-global-bundle.pem (the RDS roots are
    # private and self-signed, so Node's public store cannot verify them).
    # Not a secret. A certificate that fails to verify fails at connect time,
    # so a wrong CA or a DB_URL naming anything but the real RDS hostname
    # CrashLoops the pod rather than degrading quietly - rollback is reverting
    # this line. Procedure and the exact [db-tls:<pool>] log lines that
    # distinguish "verifying" from "the variable never reached the pod" are in
    # docs/PRODUCTION_HARDENING.md "Database TLS verification".
    DB_TLS_VERIFY: "1"
    # App-level Okta OIDC (see auth.okta_app below). The chart injects clientID and
    # clientSecret via the <app>-okta-secret; the app discovers everything else from
    # the issuer's /.well-known/openid-configuration.
    OIDC_ISSUER: https://adaptavist.okta.com
    # Must exactly match a registered redirect URI (auth.okta_app.customRedirectUris).
    # The browser lands here on the public frontend host; nginx proxies /auth/callback
    # to this private backend, which performs the token exchange.
    OIDC_REDIRECT_URL: https://adaptalabs.kubera-playground.adaptavist.net/auth/callback
    # Post-login redirect target and CORS origin - the public frontend.
    CORS_ORIGIN: https://adaptalabs.kubera-playground.adaptavist.net
    # One-time bootstrap: these emails are elevated to superadmin on OIDC login (from
    # the verified Okta ID-token email claim, never user input; only ever elevates).
    BOOTSTRAP_SUPERADMIN_EMAILS: nfine@adaptavist.com
    # CSRF protection defaults on under NODE_ENV=production (csrf-csrf double-submit;
    # token endpoint /api/csrf-token). Set ENABLE_CSRF: "false" to disable in an emergency.
    # Internalised recording storage: FirstHand's existing bucket, reached via
    # this app's IRSA role (see the irsa block below). Load-bearing - the env
    # schema treats them as optional, so a missing key boots healthy and fails
    # at upload time.
    FIRSTHAND_S3_BUCKET: firsthand-playground
    FIRSTHAND_S3_REGION: us-east-1
    # return_url for the participant redirect back into Cortex, and the origin
    # media_url/session URLs are minted from.
    FRONTEND_URL: https://adaptalabs.kubera-playground.adaptavist.net
    # Per-user Google Calendar connection (cto/AdaptaLabs#89).
    #
    # NOT SET YET, and the app is correct without it: with no client configured,
    # GET /api/calendar/auth/connect answers 503 and the UI offers no Connect
    # control at all, rather than offering one that dead-ends. Nothing else
    # degrades - the slot picker generates availability without a calendar and
    # slots can be entered by hand.
    #
    # To turn it on, three things are needed:
    #   1. GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET in the secret
    #      store below (they are secrets - they do NOT belong in this file)
    #   2. GOOGLE_OAUTH_REDIRECT_URI here, uncommented, exactly matching an
    #      authorised redirect URI on the Google OAuth client
    #   3. That same URI registered in Google Cloud Console
    #
    # The scope is calendar.readonly plus userinfo.email: Cortex reads free/busy
    # to check slot conflicts and does not write to a personal calendar.
    #
    # GOOGLE_OAUTH_REDIRECT_URI: https://adaptalabs.kubera-playground.adaptavist.net/api/calendar/auth/callback
    #
    # The shared service-account trio (GOOGLE_SERVICE_ACCOUNT_EMAIL,
    # GOOGLE_PRIVATE_KEY, GOOGLE_CALENDAR_ID) is deliberately absent: nothing
    # consumes it. Setting it changes nothing but one WARN line at boot.
# App-level Okta OIDC. The chart registers an Okta app and injects clientID/clientSecret
# into <app>-okta-secret (envFrom). Declared on THIS service (not the frontend) because
# the backend runs the token exchange. Cannot be combined with okta_alb. The backend
# stays private, so the real callback is registered explicitly via customRedirectUris -
# the chart's derived default (this app's own private host) would not be reachable.
auth:
  okta_app:
    enabled: true
    groups:
      - adaptavist-staff
    grantTypes: "authorization_code,refresh_token"
    customRedirectUris:
      - "https://adaptalabs.kubera-playground.adaptavist.net/auth/callback"
    customPostLogoutRedirectUris:
      - "https://adaptalabs.kubera-playground.adaptavist.net/"
secret:
  enabled: true
  # Secret store holds FIRSTHAND_INTEGRATION_SECRET (min 32 chars) and SESSION_SECRET.
  # The Okta clientID/clientSecret come separately from the chart-provisioned
  # <app>-okta-secret (auto-mounted via envFrom when okta_app.enabled is true).
  #
  # GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET belong here too if
  # per-user calendar connection is turned on - see the config note above
  # (cto/AdaptaLabs#89). Absent today, and the app refuses the flow cleanly
  # without them rather than falling back to fabricated tokens.
# FirstHand bucket access (permanent): Cortex records into and plays back from
# firsthand-playground, retained at migration rather than copied. The standalone
# FirstHand app is retired (source RDS decommissioned 2026-08-11) - removing
# this block revokes live recording and playback.
# The chart renders these as a Crossplane IAM Policy + RolePolicyAttachment on this
# app's IRSA role (library-chart _irsa-additional-custom-policy.yaml) - purely additive;
# remove this block to revoke. irsa.enabled is the chart default, so only the policies
# are declared here. Schema per entry: effect / action (list) / resource (single string).
irsa:
  additionalIAMPolicies:
    - effect: Allow
      action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      resource: arn:aws:s3:::firsthand-playground/*
    - effect: Allow
      action:
        - s3:ListBucket
      resource: arn:aws:s3:::firsthand-playground
resources:
  memory:
    # -- Pod requested memory
    min: 2Gi
    # -- Pod memory limit
    max: 2Gi
  cpu:
    # -- Pod requested CPU
    min: 1000m
    # -- Pod CPU limit
    max: 1000m
database:
  postgresql:
    enabled: true
    local:
      enabled: true
      image:
        repository: postgres
        tag: '17'
      port: '5432'
      database: 'postgres'
      user: 'postgres'
    deploymentType: "rds"
    rds:
      # Guards against accidental instance deletion at the AWS level: a delete
      # must first flip this off. This instance holds the migrated FirstHand
      # data; FirstHand's own production manifest set it true.
      deletionProtection: true
      # Synchronous standby in a second availability zone, with automatic
      # failover. Costs roughly double a single-AZ instance - accepted
      # deliberately: this instance is the only remaining live home of the
      # migrated FirstHand data (retention window closed 2026-08-11; the
      # source RDS is gone), and single-AZ makes an
      # AZ outage extended downtime with restore-from-backup as the worst case.
      # Multi-AZ reduces that to a failover of a minute or two - it is an
      # availability control, not a backup. Matches the chart reference recorded
      # in docs/FIRSTHAND-KUBERA-MIGRATION-PLAN.md.
      multiAz: true
      # Declared explicitly rather than left to the chart default: this instance
      # holds the migrated FirstHand data, and the FirstHand RDS was found during
      # that migration to have retention defaulted to 0, i.e. automated backups
      # and point-in-time recovery silently off. 14 days matches the value
      # FirstHand's own production manifest established.
      backupRetentionPeriod: 14
      majorEngineVersion: "17"
      engineVersion: "17.6"
      autoMinorVersionUpgrade: false
      dbFamily: "postgres17"
      skipFinalSnapshot: false
filesystem:
  writable:
    enabled: true
    directories:
      - path: /.npm
      - path: /tmp
      - path: /.local
deployment:
  livenessProbe:
    httpGet:
      path: '/health'
      port: 3001
      scheme: HTTP
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 10
  # Readiness deliberately points at the STATIC /health, not at a database
  # check. Readiness controls whether this pod receives traffic, and the
  # deployment is single-replica: taking the only pod out of the Ready set
  # during a database outage leaves the Service with no endpoints, so the
  # frontend nginx returns its own 502 Bad Gateway page instead of the app's
  # 503 with a DB_CONNECTION_FAILED code. That is worse for users and worse to
  # diagnose, and with Multi-AZ it would black the app out during every routine
  # failover: periodSeconds 10 x failureThreshold 3 takes the pod NotReady in
  # ~30s, well inside a 60-120s failover, whereas liveness (30 x 10, ~300s)
  # tolerates one comfortably.
  #
  # Dependency-driven readiness is also the classic cascading-failure
  # anti-pattern in general: every replica fails the same probe at once, so a
  # partial degradation becomes a total endpoint drain. At replicaCount > 1
  # a readiness SELECT 1 becomes defensible again - raising the replica count
  # is the real fix, and this note should be revisited alongside it.
  #
  # WHAT RAISING IT USED TO BREAK, recorded here because this is the file the
  # person raising it is editing: OAuth state lived in a per-process Map, so a
  # login callback load-balanced to another pod answered `Invalid state
  # parameter` - intermittently, for (n-1)/n of attempts, on both the Okta login
  # and the calendar connect. That is fixed (cto/AdaptaLabs#92): the state now
  # travels sealed in the browser cookie and any pod can open it. The one
  # residual is that replay-detection is per-pod, which costs nothing while
  # authorization codes are single-use at the provider.
  #
  # The database is reported at GET /api/health instead - visibility without
  # touching traffic routing. Issue #3.
  #
  # The timings below were previously omitted, which inherited Kubernetes'
  # defaults of periodSeconds 10, timeoutSeconds 1, failureThreshold 3 - so
  # three event-loop stalls over one second would have evicted the only pod.
  # Stated explicitly and matched to the liveness probe's deliberate 5s.
  readinessProbe:
    httpGet:
      path: '/health'
      port: 3001
      scheme: HTTP
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
initContainer:
  enabled: true
  command: [ "sh", "-c"]
  # migrate:firsthand chains FirstHand's checksum-guarded schema runner after
  # Cortex's own migrate+seed. It targets THIS deployment's RDS (DB_URL) -
  # see backend/scripts/firsthand-migrate.mjs. It is checksum-guarded and
  # idempotent: it creates the empty `firsthand` schema on a fresh environment
  # and is a verified no-op once the schema is populated.
  args: ["npm run migrate && npm run seed && npm run migrate:firsthand"]
  workingDir: "/app/backend"
