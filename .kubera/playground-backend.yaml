teamName: platform #Mandatory field
environment: playground
service:
  port: 3001
# Public ingress so FirstHand (Vercel, public internet) can deliver HMAC-verified
# webhook callbacks to POST /api/firsthand/callbacks. No okta_alb auth block:
# the backend enforces its own auth (cookie sessions on user/admin routes, HMAC
# signature verification on callbacks). Browser traffic still goes same-origin
# through the frontend nginx proxy; this URL exists for server-to-server calls.
ingress:
  enabled: true
  type: public
config:
  data:
    OIDC_ISSUER: https://adaptavist.okta.com
    NODE_ENV: production
    SKIP_OIDC: "true"
    ENABLE_CSRF: "false"
    # FirstHand Integration — integration is disabled at runtime unless both
    # FIRSTHAND_BASE_URL (here) and FIRSTHAND_INTEGRATION_SECRET (secret store) are set
    FIRSTHAND_BASE_URL: https://first-hand.vercel.app
    # Used to build callback_url passed to FirstHand (must be publicly reachable)
    BACKEND_URL: https://adaptalabs-backend.kubera-playground.adaptavist.net
    # Used to build return_url for the participant redirect back to Cortex
    FRONTEND_URL: https://adaptalabs.kubera-playground.adaptavist.net
secret:
  enabled: true
  # Required for FirstHand integration: FIRSTHAND_INTEGRATION_SECRET (min 32 chars,
  # must match the FIRSTHAND_INTEGRATION_SECRET on the FirstHand Vercel project)
resources:
  memory:
    # -- Pod requested memory
    min: 2Gi
    # -- Pod memory limit
    max: 2Gi
  cpu:
    # -- Pod requested CPU
    min: 1000m
    # -- Pod CPU limit
    max: 1000m
database:
  postgresql:
    enabled: true
    local:
      enabled: true
      image:
        repository: postgres
        tag: '17'
      port: '5432'
      database: 'postgres'
      user: 'postgres'
    deploymentType: "rds"
    rds:
      deletionProtection: false
      majorEngineVersion: "17"
      engineVersion: "17.6"
      autoMinorVersionUpgrade: false
      dbFamily: "postgres17"
      skipFinalSnapshot: false
filesystem:
  writable:
    enabled: true
    directories:
      - path: /.npm
      - path: /tmp
      - path: /.local
deployment:
  livenessProbe:
    httpGet:
      path: '/health'
      port: 3001
      scheme: HTTP
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: '/health'
      port: 3001
      scheme: HTTP
    initialDelaySeconds: 20
initContainer:
  enabled: true
  command: [ "sh", "-c"]
  args: ["npm run migrate && npm run seed"]
  workingDir: "/app/backend"