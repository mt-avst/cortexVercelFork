teamName: platform #Mandatory field
environment: playground
service:
  port: 3000
# Plain public ingress, no auth block: the frontend is just static SPA assets plus
# an nginx proxy for /api and /auth. Authentication is enforced by the backend
# (app-level Okta OIDC via auth.okta_app on adaptalabs-backend). okta_alb was removed
# because it cannot coexist with the backend's okta_app and it blocked FirstHand's
# server-to-server webhooks.
ingress:
  enabled: true
  type: public
config:
  data:
    OIDC_ISSUER: https://adaptavist.okta.com
secret:
  enabled: true
resources:
  memory:
    # -- Pod requested memory
    min: 2Gi
    # -- Pod memory limit
    max: 2Gi
  cpu:
    # -- Pod requested CPU
    min: 1000m
    # -- Pod CPU limit
    max: 1000m
filesystem:
  writable:
    enabled: true
    directories:
      - path: /var/cache/nginx
      - path: /var/run
      - path: /var/log/nginx
      - path: /tmp
deployment:
  livenessProbe:
    httpGet:
      path: '/health'
      port: 3000
      scheme: HTTP
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: '/health'
      port: 3000
      scheme: HTTP
    initialDelaySeconds: 20
