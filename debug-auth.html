<!DOCTYPE html>
<html>
<head>
    <title>Frontend Auth Debug</title>
</head>
<body>
    <h1>Frontend Authentication Debug</h1>
    <button onclick="testLogin()">Test Login Flow</button>
    <button onclick="testAPI()">Test API Call</button>
    <button onclick="checkCookies()">Check Cookies</button>
    <div id="result"></div>

    <script>
        function checkCookies() {
            document.getElementById('result').innerHTML = 'Cookies: ' + document.cookie;
        }

        async function testLogin() {
            try {
                // Simulate the login flow
                window.location.href = 'http://localhost:3001/auth/login';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Login error: ' + error.message;
            }
        }

        async function testAPI() {
            try {
                const response = await fetch('http://localhost:3001/api/me', {
                    method: 'GET',
                    credentials: 'include',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('result').innerHTML = 'API Success: ' + JSON.stringify(data, null, 2);
                } else {
                    document.getElementById('result').innerHTML = 'API Failed: ' + response.status + ' ' + response.statusText;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = 'API Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
