# Local development database only. The app itself runs with `npm run dev:all`
# (backend :3001, frontend :3000) and deploys to Vercel - there are no app
# images any more.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:password@localhost:5432/adaptalabs_dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: adaptalabs_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
