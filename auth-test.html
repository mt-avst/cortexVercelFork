<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .pass { background-color: #d4edda; }
        .fail { background-color: #f8d7da; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>🔐 Authentication Test Page</h1>
    
    <div class="test">
        <h3>Test 1: Check Initial State</h3>
        <p>When you first load this page, you should see login buttons, not a logged-in state.</p>
        <button onclick="testInitialState()">Test Initial State</button>
        <div id="initial-result"></div>
    </div>
    
    <div class="test">
        <h3>Test 2: Login as Regular User</h3>
        <button onclick="loginAsUser()">Login as User</button>
        <div id="user-result"></div>
    </div>
    
    <div class="test">
        <h3>Test 3: Login as Admin</h3>
        <button onclick="loginAsAdmin()">Login as Admin</button>
        <div id="admin-result"></div>
    </div>
    
    <div class="test">
        <h3>Test 4: Logout</h3>
        <button onclick="logout()">Logout</button>
        <div id="logout-result"></div>
    </div>

    <script>
        async function testInitialState() {
            const result = document.getElementById('initial-result');
            try {
                const response = await fetch('/api/me');
                if (response.status === 401) {
                    result.innerHTML = '<span class="pass">✅ PASS: Correctly shows not logged in</span>';
                } else {
                    result.innerHTML = '<span class="fail">❌ FAIL: Should not be logged in</span>';
                }
            } catch (error) {
                result.innerHTML = '<span class="fail">❌ ERROR: ' + error.message + '</span>';
            }
        }

        async function loginAsUser() {
            const result = document.getElementById('user-result');
            try {
                window.location.href = '/auth/login';
            } catch (error) {
                result.innerHTML = '<span class="fail">❌ ERROR: ' + error.message + '</span>';
            }
        }

        async function loginAsAdmin() {
            const result = document.getElementById('admin-result');
            try {
                window.location.href = '/auth/admin-login';
            } catch (error) {
                result.innerHTML = '<span class="fail">❌ ERROR: ' + error.message + '</span>';
            }
        }

        async function logout() {
            const result = document.getElementById('logout-result');
            try {
                const response = await fetch('/auth/logout', { method: 'POST' });
                if (response.ok) {
                    result.innerHTML = '<span class="pass">✅ PASS: Logout successful</span>';
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    result.innerHTML = '<span class="fail">❌ FAIL: Logout failed</span>';
                }
            } catch (error) {
                result.innerHTML = '<span class="fail">❌ ERROR: ' + error.message + '</span>';
            }
        }

        // Test initial state on page load
        window.onload = function() {
            setTimeout(testInitialState, 1000);
        };
    </script>
</body>
</html>
