<!DOCTYPE html>
<html>
<head>
    <title>Frontend-Backend Test</title>
</head>
<body>
    <h1>Frontend-Backend Connection Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            try {
                const response = await fetch('http://localhost:3001/auth/login', {
                    method: 'GET',
                    credentials: 'include',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = '✅ Login successful - redirected to frontend';
                    // Wait a moment then test API
                    setTimeout(testAPI, 1000);
                } else {
                    document.getElementById('result').innerHTML = '❌ Login failed: ' + response.status;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = '❌ Login error: ' + error.message;
            }
        }

        async function testAPI() {
            try {
                const response = await fetch('http://localhost:3001/api/me', {
                    method: 'GET',
                    credentials: 'include',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('result').innerHTML = '✅ API call successful: ' + JSON.stringify(data, null, 2);
                } else {
                    document.getElementById('result').innerHTML = '❌ API call failed: ' + response.status;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = '❌ API error: ' + error.message;
            }
        }
    </script>
</body>
</html>
