server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Handle React Router
    #
    # no-cache on the entry document (cto/AdaptaLabs#91). Everything this block
    # serves is index.html or another non-hashed document, and index.html names
    # content-hashed chunk files that stop existing at the next deploy. Served
    # with an etag and NO cache-control, browsers apply heuristic freshness and
    # may reuse a stale copy without asking - so a tab left open across a
    # release 404s on its own chunks and reads as "the app is broken".
    # `no-cache` means revalidate-every-time, not never-store: the etag makes
    # that a bodiless 304, so the cost is one conditional request. Not
    # `no-store`, which would re-download the document on every navigation for
    # no benefit. The hashed assets below keep `immutable` - safe precisely
    # because their names change.
    #
    # The four security headers are REPEATED here for the same reason they are
    # in the version.json block: nginx does not inherit server-level
    # `add_header` directives into a location block that declares its own, so
    # adding Cache-Control alone would silently strip nosniff and the rest from
    # every SPA route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache static assets. One canonical Cache-Control rather than the old
    # `expires 1y` + `add_header` pair, which emitted TWO Cache-Control
    # headers. The four security headers are restated here for the same
    # inheritance reason as in location / - this block already declared an
    # add_header, so it had silently lost them (nosniff on served JS being
    # the one that matters).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        # No `always` on the Cache-Control (unlike the security headers): with
        # it, a 404 for a chunk name mid-rollout would be cached immutable for
        # a year, wedging the app for that browser. A 404 with no cache-control
        # is not stored.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Web fonts. NOT in the block above on purpose: files under public/ are
    # copied verbatim, not content-hashed, so a year of `immutable` would make
    # a font swap invisible for a year. A finite max-age is the safe shape for
    # an unhashed asset that still deserves better than revalidate-every-load.
    location ~* \.(woff2?|ttf|otf|eot)$ {
        # No `always`, same 404-caching reason as the block above.
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Which commit this frontend build was produced from, written by
    # scripts/write-frontend-version.js during the build.
    #
    # EXACT MATCH (`location =`), and that is the point of it. The SPA fallback
    # in `location /` is `try_files $uri $uri/ /index.html`, so a MISSING
    # version.json would be served as index.html with HTTP 200 - a check for
    # "did I get 200?" would pass on a build that never wrote the file, which is
    # exactly the false confidence this endpoint exists to remove. An exact
    # match takes priority over the prefix location and does not fall back, so a
    # missing file answers 404 and says so.
    #
    # no-store because a cached copy of this file defeats its entire purpose:
    # the one question it answers is "which build is being served RIGHT NOW",
    # and a stale answer is worse than none. Matches the Cache-Control the
    # backend sets on /api/health.
    #
    # The four security headers are REPEATED here deliberately. nginx does not
    # inherit server-level `add_header` directives into a location block that
    # declares its own, so without these this one path would silently lose
    # nosniff and the rest.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Health check endpoint. Restates the security headers because its own
    # add_header (Content-Type) already cost it the server-level set - the
    # same inheritance trap as every other block here.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Session media streaming (FirstHand recordings): buffering breaks Range-request
    # scrubbing, so stream responses straight through. Regex location, so it takes
    # precedence over the prefix /api/ block below for these URIs only.
    location ~ ^/api/opportunities/[^/]+/sessions/[^/]+/assets/[^/]+/media$ {
        proxy_pass http://adaptalabs-backend.adaptalabs.svc.cluster.local:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
    }

    location /api/ {
    proxy_pass http://adaptalabs-backend.adaptalabs.svc.cluster.local:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    }

  location /auth/ {
      proxy_pass http://adaptalabs-backend.adaptalabs.svc.cluster.local:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
  }
}
