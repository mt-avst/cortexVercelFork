<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 0 40 40">
  <!--
    Tab-icon rendering of the Cortex "Neuron" mark (see CortexMark.tsx for the
    canonical 48x48 geometry, same coordinates, no redraw). currentColor
    cannot resolve on a standalone favicon, so the fill is the brand orange
    (brand-orange-500 token, hex FF5A1F) baked in directly. The viewBox is
    tightened to the mark's own bounding box (plus even padding) rather than
    the component's full 48x48 artboard, so the glyph reads at 16px
    browser-tab scale instead of sitting small and centered in empty margin
    (row 13).
  -->
  <g stroke="#FF5A1F" stroke-width="4.8" stroke-linecap="round" fill="none">
    <path d="M24 24 24 9" />
    <path d="M24 24 12 31.5" />
    <path d="M24 24 36 31.5" />
  </g>
  <circle cx="24" cy="9" r="4.2" fill="#FF5A1F" />
  <circle cx="12" cy="31.5" r="4.2" fill="#FF5A1F" />
  <circle cx="36" cy="31.5" r="4.2" fill="#FF5A1F" />
  <circle cx="24" cy="24" r="6.5" fill="#FF5A1F" />
</svg>
