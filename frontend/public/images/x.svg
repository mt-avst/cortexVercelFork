<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="400" height="400" fill="#000000"/>
  
  <!-- Left Network -->
  <g fill="none" stroke="#ff6b35" stroke-width="3">
    <!-- Large circle top-left -->
    <circle cx="100" cy="120" r="20" fill="#ff6b35"/>
    <!-- Small circles connected to top-left -->
    <circle cx="80" cy="100" r="8" fill="#ff6b35"/>
    <circle cx="120" cy="100" r="8" fill="#ff6b35"/>
    <circle cx="90" cy="140" r="8" fill="#ff6b35"/>
    <circle cx="110" cy="140" r="8" fill="#ff6b35"/>
    <!-- Lines connecting to top-left -->
    <line x1="100" y1="120" x2="80" y2="100"/>
    <line x1="100" y1="120" x2="120" y2="100"/>
    <line x1="100" y1="120" x2="90" y2="140"/>
    <line x1="100" y1="120" x2="110" y2="140"/>
    
    <!-- Large circle bottom-left -->
    <circle cx="100" cy="280" r="20" fill="#ff6b35"/>
    <!-- Small circles connected to bottom-left -->
    <circle cx="80" cy="260" r="8" fill="#ff6b35"/>
    <circle cx="120" cy="260" r="8" fill="#ff6b35"/>
    <circle cx="90" cy="300" r="8" fill="#ff6b35"/>
    <circle cx="110" cy="300" r="8" fill="#ff6b35"/>
    <!-- Lines connecting to bottom-left -->
    <line x1="100" y1="280" x2="80" y2="260"/>
    <line x1="100" y1="280" x2="120" y2="260"/>
    <line x1="100" y1="280" x2="90" y2="300"/>
    <line x1="100" y1="280" x2="110" y2="300"/>
    
    <!-- Connection between top and bottom left -->
    <line x1="100" y1="140" x2="100" y2="260"/>
  </g>
  
  <!-- Central Test Tube -->
  <g>
    <!-- Test tube outline -->
    <path d="M 180 80 L 180 320 L 220 320 L 220 80 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <!-- Test tube opening -->
    <ellipse cx="200" cy="80" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Orange liquid with gradient -->
    <defs>
      <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect x="184" y="200" width="32" height="112" fill="url(#liquidGradient)"/>
    
    <!-- Bubbles in the liquid -->
    <circle cx="195" cy="220" r="3" fill="#ffffff"/>
    <circle cx="205" cy="240" r="3" fill="#ffffff"/>
    <circle cx="200" cy="260" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Right Network -->
  <g fill="none" stroke="#ff6b35" stroke-width="3">
    <!-- Large circle top-right -->
    <circle cx="300" cy="120" r="20" fill="#ff6b35"/>
    <!-- Small circles connected to top-right -->
    <circle cx="280" cy="100" r="8" fill="#ff6b35"/>
    <circle cx="320" cy="100" r="8" fill="#ff6b35"/>
    <circle cx="290" cy="140" r="8" fill="#ff6b35"/>
    <circle cx="310" cy="140" r="8" fill="#ff6b35"/>
    <!-- Lines connecting to top-right -->
    <line x1="300" y1="120" x2="280" y2="100"/>
    <line x1="300" y1="120" x2="320" y2="100"/>
    <line x1="300" y1="120" x2="290" y2="140"/>
    <line x1="300" y1="120" x2="310" y2="140"/>
    
    <!-- Large circle bottom-right -->
    <circle cx="300" cy="280" r="20" fill="#ff6b35"/>
    <!-- Small circles connected to bottom-right -->
    <circle cx="280" cy="260" r="8" fill="#ff6b35"/>
    <circle cx="320" cy="260" r="8" fill="#ff6b35"/>
    <circle cx="290" cy="300" r="8" fill="#ff6b35"/>
    <circle cx="310" cy="300" r="8" fill="#ff6b35"/>
    <!-- Lines connecting to bottom-right -->
    <line x1="300" y1="280" x2="280" y2="260"/>
    <line x1="300" y1="280" x2="320" y2="260"/>
    <line x1="300" y1="280" x2="290" y2="300"/>
    <line x1="300" y1="280" x2="310" y2="300"/>
    
    <!-- Connection between top and bottom right -->
    <line x1="300" y1="140" x2="300" y2="260"/>
  </g>
</svg>
