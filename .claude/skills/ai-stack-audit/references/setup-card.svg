<!--
  ai-stack-audit shareable "setup card".
  A single self-contained image (1200x630, share/OG ratio) summarising one stack.
  Fill the {{PLACEHOLDERS}} from the discovery inventory, write it to a .svg file,
  and hand it to the user (SendUserFile where available). System fonts only, so it
  renders the same on any machine with no web-font fetch. Deliberately single-theme
  (dark) - a shared image commits to one look.
    {{TITLE}}      2-4 word stack name, e.g. "Ada's Claude Code Stack"
    {{RULES}} {{AGENTS}} {{SKILLS}} {{MCP}} {{MEMORY}} {{TOKENS}}   from inventory.summary
    {{AUDIT}}      one-line audit headline, e.g. "0 open findings" or "1 medium · context-cost"
    {{AUDIT_HEX}}  dot colour: #6dbb82 clean · #cbb051 low · #e2953f medium · #e5675a high/critical
    {{DATE}}       ISO date
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="{{TITLE}} - Claude Code stack card">
  <defs>
    <marker id="cA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c8373"/></marker>
    <marker id="cO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6a33"/></marker>
    <style>
      .disp{font-family:Georgia,"Times New Roman",serif}
      .mono{font-family:ui-monospace,Menlo,"DejaVu Sans Mono",monospace}
      .sans{font-family:system-ui,-apple-system,Arial,sans-serif}
    </style>
  </defs>

  <!-- ground + frame -->
  <rect x="0" y="0" width="1200" height="630" fill="#16150f"/>
  <rect x="16" y="16" width="1168" height="598" rx="18" fill="#1b1a12" stroke="#3b382c" stroke-width="1.5"/>

  <!-- eyebrow + title -->
  <text x="60" y="86" class="mono" font-size="15" letter-spacing="3" fill="#ff8a5c">CLAUDE CODE  ·  MAP + AUDIT</text>
  <text x="58" y="150" class="disp" font-size="54" font-weight="600" fill="#efe9dd">{{TITLE}}</text>

  <!-- stat tiles -->
  <g>
    <!-- x: 60 242 424 606 788 970 ; w 166 h 96 y 190 -->
    <g>
      <rect x="60"  y="190" width="166" height="96" rx="12" fill="#201e16" stroke="#3b382c"/>
      <text x="76" y="248" class="disp" font-size="38" font-weight="600" fill="#efe9dd">{{RULES}}</text>
      <text x="76" y="270" class="mono" font-size="12" letter-spacing="1" fill="#8c8373">RULES</text>
    </g>
    <g>
      <rect x="242" y="190" width="166" height="96" rx="12" fill="#201e16" stroke="#3b382c"/>
      <text x="258" y="248" class="disp" font-size="38" font-weight="600" fill="#efe9dd">{{AGENTS}}</text>
      <text x="258" y="270" class="mono" font-size="12" letter-spacing="1" fill="#8c8373">AGENTS</text>
    </g>
    <g>
      <rect x="424" y="190" width="166" height="96" rx="12" fill="#201e16" stroke="#3b382c"/>
      <text x="440" y="248" class="disp" font-size="38" font-weight="600" fill="#efe9dd">{{SKILLS}}</text>
      <text x="440" y="270" class="mono" font-size="12" letter-spacing="1" fill="#8c8373">SKILLS</text>
    </g>
    <g>
      <rect x="606" y="190" width="166" height="96" rx="12" fill="#201e16" stroke="#3b382c"/>
      <text x="622" y="248" class="disp" font-size="38" font-weight="600" fill="#efe9dd">{{MCP}}</text>
      <text x="622" y="270" class="mono" font-size="12" letter-spacing="1" fill="#8c8373">MCP SERVERS</text>
    </g>
    <g>
      <rect x="788" y="190" width="166" height="96" rx="12" fill="#201e16" stroke="#3b382c"/>
      <text x="804" y="248" class="disp" font-size="38" font-weight="600" fill="#efe9dd">{{MEMORY}}</text>
      <text x="804" y="270" class="mono" font-size="12" letter-spacing="1" fill="#8c8373">MEMORY FACTS</text>
    </g>
    <g>
      <rect x="970" y="190" width="170" height="96" rx="12" fill="#201e16" stroke="#4a3a2a"/>
      <text x="986" y="248" class="disp" font-size="38" font-weight="600" fill="#ff8a5c">{{TOKENS}}</text>
      <text x="986" y="270" class="mono" font-size="12" letter-spacing="1" fill="#8c8373">TOKENS / SESSION</text>
    </g>
  </g>

  <!-- pipeline strip -->
  <text x="60" y="348" class="mono" font-size="13" letter-spacing="2" fill="#8c8373">HOW A TASK MOVES</text>
  <g>
    <!-- 7 nodes w128 h40 y366 ; x 60 218 376 534 692 850 1008 -->
    <g class="sans" font-size="14" fill="#efe9dd" text-anchor="middle">
      <rect x="60"   y="366" width="128" height="40" rx="8" fill="none" stroke="#8c8373" stroke-width="1.3"/><text x="124" y="391">Boot</text>
      <rect x="218"  y="366" width="128" height="40" rx="8" fill="none" stroke="#8c8373" stroke-width="1.3"/><text x="282" y="391">Research</text>
      <rect x="376"  y="366" width="128" height="40" rx="8" fill="none" stroke="#8c8373" stroke-width="1.3"/><text x="440" y="391">Plan</text>
      <rect x="534"  y="366" width="128" height="40" rx="8" fill="none" stroke="#8c8373" stroke-width="1.3"/><text x="598" y="391">Build</text>
      <rect x="692"  y="366" width="128" height="40" rx="8" fill="none" stroke="#ff6a33" stroke-width="1.8"/><text x="756" y="391" fill="#ff8a5c">Review</text>
      <rect x="850"  y="366" width="128" height="40" rx="8" fill="none" stroke="#8c8373" stroke-width="1.3"/><text x="914" y="391">Ship</text>
      <rect x="1008" y="366" width="128" height="40" rx="8" fill="none" stroke="#8c8373" stroke-width="1.3"/><text x="1072" y="391">Memory</text>
    </g>
    <g fill="none">
      <line x1="188" y1="386" x2="216" y2="386" stroke="#8c8373" stroke-width="1.4" marker-end="url(#cA)"/>
      <line x1="346" y1="386" x2="374" y2="386" stroke="#8c8373" stroke-width="1.4" marker-end="url(#cA)"/>
      <line x1="504" y1="386" x2="532" y2="386" stroke="#8c8373" stroke-width="1.4" marker-end="url(#cA)"/>
      <line x1="662" y1="386" x2="690" y2="386" stroke="#8c8373" stroke-width="1.4" marker-end="url(#cA)"/>
      <line x1="820" y1="386" x2="848" y2="386" stroke="#ff6a33" stroke-width="1.6" marker-end="url(#cO)"/>
      <line x1="978" y1="386" x2="1006" y2="386" stroke="#8c8373" stroke-width="1.4" marker-end="url(#cA)"/>
    </g>
    <!-- review -> build loop-back -->
    <path d="M712 406 C 690 436, 600 436, 590 407" fill="none" stroke="#ff6a33" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#cO)"/>
    <text x="651" y="452" class="mono" font-size="11" fill="#ff8a5c" text-anchor="middle">findings → back to build</text>
  </g>

  <!-- audit headline -->
  <rect x="60" y="498" width="1080" height="64" rx="12" fill="#201e16" stroke="#3b382c"/>
  <circle cx="92" cy="530" r="8" fill="{{AUDIT_HEX}}"/>
  <text x="114" y="524" class="mono" font-size="12" letter-spacing="1" fill="#8c8373">AUDIT</text>
  <text x="114" y="544" class="sans" font-size="17" font-weight="600" fill="#efe9dd">{{AUDIT}}</text>

  <!-- footer -->
  <text x="60" y="596" class="mono" font-size="12" fill="#6b6456">generated by ai-stack-audit  ·  measured from ~/.claude + project  ·  {{DATE}}</text>
</svg>
