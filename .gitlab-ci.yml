include:
  # Docker build component
  - component: "$CI_SERVER_FQDN/to-be-continuous/docker/gitlab-ci-docker@6.1"

  # semantic-release component
  - component: "$CI_SERVER_FQDN/to-be-continuous/semantic-release/gitlab-ci-semrel@3.11"
  
  # Congigures the above components and retrieve the necessary credentials from Secrets Manager
  - component: "$CI_SERVER_FQDN/to-be-continuous/kubera-init/gitlab-ci-kubera-init@1"

  - component: "$CI_SERVER_FQDN/to-be-continuous/gitleaks/gitlab-ci-gitleaks@2.9"
    
  # Kubera component
  - component: "$CI_SERVER_FQDN/to-be-continuous/kubera/gitlab-ci-kubera@1"
    inputs:
      # Optional. Defaults to the below example. Supported environments are playground and production.
      environments: >-
        [
          {"name":"playground","deploy_strategy":"auto"}
        ]
      multi-app: >-
        [
          {"subfolder":"$APP_1","app_name":"adaptalabs-backend","app_namespace":"adaptalabs"},
          {"subfolder":"$APP_2","app_name":"adaptalabs","app_namespace":"adaptalabs","depends_on":"$APP_1"}
        ]

      # Optional Branch Based Deployment input parameters
      # 1. Enable branch based deployment every time a commit is pushed to feature branch
      # defaults to false
      feat-deploy-on-push: "false"
      
      # 2. Enable branch based deployment every time a commit is pushed to an open MR source branch only
      # defaults to true
      feat-deploy-on-merge-request: "false"
      
      # 3. Enable cleanup of any leftover branch based deployments on merge
      # defaults to true
      feat-cleanup-on-merge: "true"

variables:
  APP_1: backend
  APP_2: frontend
  # Bake the commit into both images so GET /api/health can report which build
  # is running (backend/src/utils/buildInfo.ts). Without it the deployed backend
  # served nothing that changed between releases, so "has my fix rolled out?"
  # had no answer short of cluster access.
  #
  # The COMMIT rather than the release version, because the version does not
  # exist yet at build time: images are built on the main-branch pipeline and
  # semantic-release cuts the tag afterwards, so $CI_COMMIT_REF_NAME here is
  # `main`. $CI_COMMIT_SHA is identical for the snapshot and release images of
  # a commit, which is what makes it a reliable marker.
  #
  # SET HERE AND NOT AS THE DOCKER COMPONENT'S `build-args` INPUT, which is the
  # obvious place and does not work: a later include sets DOCKER_BUILD_ARGS as a
  # global variable, and that silently wins over the value the input generates.
  # Passing the input produced a config the CI lint called valid and in which
  # APP_COMMIT_SHA appeared exactly zero times. Verify a change here by linting
  # the resolved config and grepping for APP_COMMIT_SHA rather than by reading
  # this file.
  #
  # `--ignore-path /workspace` is carried over from the value this replaces and
  # must stay: it is what that later include was setting, and dropping it
  # changes what kaniko snapshots.
  DOCKER_BUILD_ARGS: "--ignore-path /workspace --build-arg APP_COMMIT_SHA=$CI_COMMIT_SHA"

.docker-base:
  parallel:
    matrix:
      - APP: "$APP_1"
        DOCKER_FILE: "$APP_1/Dockerfile"
        DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/$APP_1/snapshot:$CI_COMMIT_REF_SLUG"
        DOCKER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/$APP_1:$CI_COMMIT_REF_NAME"
        DOCKER_CONTEXT_PATH: "."
        DOCKER_BUILD_CACHE_DISABLED: "true"
      - APP: "$APP_2"
        DOCKER_FILE: "$APP_2/Dockerfile"
        DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/$APP_2/snapshot:$CI_COMMIT_REF_SLUG"
        DOCKER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/$APP_2:$CI_COMMIT_REF_NAME"
        DOCKER_CONTEXT_PATH: "."
        DOCKER_BUILD_CACHE_DISABLED: "true"
# Cap the advisory security_reports_gate (injected by the private kubera
# component - it is not defined in the public docker@6.1 template) at 5
# minutes instead of inheriting the 60-minute default. The gate is
# allow_failure on every pipeline, and its failure mode is a silent hang to
# the full job timeout while publish/deploy jobs queue behind it - observed
# even with every scan green (main pipeline for e2ca23d5, 2026-07-23: all
# scans passed, gate still burned 00:41->01:41 before timing out). Healthy
# gate runs complete in seconds, so 5m is generous headroom. Remove this
# override if/when the component's gate is fixed upstream.
# Catch a merge to main that changed deployed code but will not deploy it.
#
# Cortex ships by release tag: semantic-release cuts a version, that becomes the
# image tag, ArgoCD rolls it. semantic-release releases feat/fix/perf/revert and
# breaking changes ONLY - so a merge squashed as refactor:, docs:, chore:,
# style:, test: or build: cuts no version and never deploys, while every job
# here still reports success. MR !94 (2026-08-13) was exactly that: a
# user-visible rename squashed as `refactor:`, merged and undeployed behind a
# fully green pipeline, indistinguishable from a platform stall.
#
# Runs in .pre off the semantic-release-info dotenv, so it goes red about two
# minutes after the merge rather than whenever someone next looks at the site.
# GIT_DEPTH: 0 because the check diffs against the last release tag, which a
# shallow clone does not have.
check-release-will-deploy:
  stage: .pre
  image: registry.hub.docker.com/library/alpine:3.20
  needs:
    - job: semantic-release-info
      artifacts: true
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - sh ci/check-release-will-deploy.sh
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

security_reports_gate:
  timeout: 5m

# Take the advisory source scans off the deploy critical path.
#
# Measured on the main pipeline for a55160d (audit #114, 2026-09-10): the .pre
# stage (lint + tests + the 4-shard mutation-canary) finished at 10:49, the
# scans then ran in their own stage 10:49->10:55, and only then did the docker
# build start at 10:55:39. gitlab-advanced-sast alone was ~6 min; the other
# three finish in seconds. Every one of these is allow_failure - they are
# advisory and cannot gate a deploy - so serialising the build behind them buys
# nothing and costs ~6 min on every merge to main.
#
# Relocating them into .pre (needs: [] so they start immediately) overlaps them
# with the mutation-canary, which is the .pre long pole at ~9 min, so the scans
# finish inside that window and no longer sit between the tests and the build.
# They still run, still report, still allow_failure - only their position moves.
# docker-trivy is deliberately NOT here: it scans the built image and cannot run
# before the build exists. Their rules (which refs they run on) are untouched.
gitlab-advanced-sast:
  stage: .pre
  needs: []
kics-iac-sast:
  stage: .pre
  needs: []
gemnasium-dependency_scanning:
  stage: .pre
  needs: []
secret_detection:
  stage: .pre
  needs: []

# Lint. Nothing in this pipeline ran ESLint before, because ESLint was not
# installed - the frontend/.eslintrc.js that existed was inert.
#
# The rule policy lives in eslint.config.mjs at the repo root. Every rule is an
# error; the 396 pre-existing violations are recorded per file and per rule in
# eslint-suppressions.json. So a new violation fails even if someone fixed one
# somewhere else in the same change - which no aggregate count can do, however
# it is asserted - and ESLint also fails the run when a suppression stops being
# needed, which is what stops the record quietly drifting out of date. Run
# `npm run lint:prune` when it says so.
#
# Root `npm ci` only. The config uses the non-type-aware typescript-eslint
# preset, so parsing frontend/ and backend/ sources needs neither of their
# dependency trees installed.
#
# Image pinned exactly, and to the same Node the apps build on - matching
# backend/Dockerfile's own "bump deliberately, in git" standard.
lint:
  stage: .pre
  image: registry.hub.docker.com/library/node:20.20.2-alpine3.22
  needs: []
  interruptible: true
  script:
    - npm ci --ignore-scripts
    - npm run lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

# Tests. Until now this pipeline ran lint and nothing else, which is how the
# whole e2e suite came to collect zero tests from the initial commit onwards
# without anyone noticing. The unit and integration suites are the cheap part
# of the gate - no database, no stack, no seed data, and they mutate nothing -
# so they run in .pre alongside lint, and a red suite stops the pipeline before
# it spends anything on building images.
#
# Not covered here, deliberately: the rest of the e2e suite, which needs
# postgres and a seeded database, and three of whose specs create and publish
# studies. e2e/accessibility.test.ts is the exception - it stubs the two API
# calls it depends on, so it runs against a static build with no backend at
# all. See test-a11y below.
#
# Image pinned to the same Node the apps build on, matching lint and
# backend/Dockerfile. Root `npm ci` comes first in every job: the suites import
# from shared/, whose dependencies (zod among them) resolve out of the root
# tree, and without it 13 backend suites fail to load.
.test-base:
  stage: .pre
  image: registry.hub.docker.com/library/node:20.20.2-alpine3.22
  needs: []
  interruptible: true
  # Cache npm's DOWNLOAD store, not node_modules: `npm ci` deletes node_modules
  # by design, so caching that would be a no-op, while the store keeps every
  # tarball so repeat installs verify checksums instead of refetching. The dir
  # sits inside the project (GitLab caches cannot leave it) and is gitignored,
  # so the canary's clean-tree guard - which decides with `git status` - never
  # sees it. key:files takes at most two files (a GitLab limit); the frontend
  # lockfile not being in the key only means a frontend bump reuses the old
  # store and adds to it, which is correct for a content-addressed store.
  cache:
    key:
      files:
        - package-lock.json
        - backend/package-lock.json
    paths:
      - .npm/
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    # The backend takes its connection string from the first of these four that
    # is set - see backend/src/config/databaseUrl.ts, where reading DATABASE_URL
    # alone is recorded as a proven landmine. Blank all four: with any of them
    # present, race-condition.test.ts opens a real connection and fails against
    # a schema that does not exist here. Empty string is falsy, so the resolver
    # falls through to undefined exactly as it does on a developer's machine.
    DATABASE_URL: ""
    POSTGRES_URL: ""
    POSTGRESQL_URL: ""
    DB_URL: ""
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

test-backend:
  extends: .test-base
  # SHARDED to bound peak memory. The single-process jest run of the whole
  # backend suite (1500+ tests) was OOM-killed (exit 137, 'OOMKilled') on the
  # shared runners at the container's memory ceiling - every test passed, then
  # the container was reaped at cleanup. `parallel: N` makes GitLab set
  # CI_NODE_INDEX/CI_NODE_TOTAL itself (a mismatched pair cannot be typed by
  # hand), and jest/vitest `--shard=<index>/<total>` split the test FILES across
  # the N jobs, so each holds a fraction of the modules and workers. Same
  # mechanism the mutation-canary uses below. If `parallel:` is ever removed the
  # pair is unset and `--shard=/` fails loudly rather than silently running one
  # unsharded job back at the ceiling. Sharding by FILE is safe here: jest and
  # vitest each isolate a file per worker, so no cross-file state is split.
  parallel: 2
  variables:
    # shared/config/environment.ts validates the environment at import time and
    # requires a session secret of at least 32 characters. Without one, 4 of the
    # 32 jest suites fail to load before running a single test. This is a fixed
    # test constant rather than a credential: no session it signs outlives the
    # job, and the deployed value comes from the Kubera secret store.
    SESSION_SECRET: "gitlab-ci-test-constant-not-a-real-secret" # gitleaks:allow
    # Two vitest files - runtime-object-storage-s3.test.ts and
    # s3-upload-integration.test.ts - start a real MinIO container and fail
    # loudly rather than silently skipping when Docker is absent. These runners
    # are tagged no-docker, which is why the image build uses kaniko, so there
    # is no daemon to give them. This is the opt-out those files document.
    #
    # What that costs, stated plainly: the S3 object-storage and direct-upload
    # integration paths are NOT covered by this job. They still run locally,
    # where Docker is available, and they are the same category as the e2e
    # suite - real infrastructure, not a unit test. 8 tests, reported as
    # skipped rather than passed, so the log never claims more than it ran.
    FIRSTHAND_SKIP_S3_TESTS: "1"
    # Same bargain, different dependency - but only for THIS job. THREE vitest
    # files - runtime-response-attachment-postgres.test.ts,
    # studies-repository-autosave-postgres.test.ts and
    # survey-csv-export-postgres.test.ts - need a real Postgres so that
    # constraints, predicates, parameters and ordering are actually evaluated
    # rather than mocked away: 0004's per-statement UNIQUE (study_id,
    # step_order), 0010's composite primary key, 0015's composite foreign key,
    # ON DELETE SET NULL and the CHECK requiring study_id and step_id to be
    # NULL together, and the survey export's tenant-isolation predicate.
    #
    # Skipped HERE because this job has no database. They are NOT skipped in
    # the pipeline: test-backend-db below runs every one of them against a
    # Postgres service. That job is the reason this comment no longer ends
    # with a list of things nothing checks.
    FIRSTHAND_SKIP_DB_TESTS: "1"
  script:
    - npm ci
    - cd backend && npm ci
    - npm test -- --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"
    - npm run test:vitest -- --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"

# The suites that need a real database, which until now ran nowhere but on a
# developer's machine.
#
# WHY THIS JOB EXISTS. The three *-postgres.test.ts files could only obtain a
# database by starting a container, and these runners are tagged no-docker - so
# `docker info` failed and the only honest thing left was to skip. The cost was
# not evenly spread: survey-csv-export-postgres.test.ts is the only place the
# survey CSV export's tenant-isolation predicate is evaluated at all. Collapsing
# the per-opportunity scope to a study-wide one - which hands one researcher
# every participant another recruited under different consent wording - passed
# 588 tests under this pipeline's old configuration and fails two by name under
# this job. That gap is the whole reason for the job.
#
# A GitLab `services:` container is not Docker-in-Docker: the executor provides
# it, so the no-docker tag does not forbid it. The tests take the connection
# string from FIRSTHAND_TEST_DATABASE_URL and each file creates its own database
# on the shared server, because they all migrate into the same `firsthand`
# schema and TRUNCATE it between tests - pointed at one database they would
# truncate each other's fixtures.
#
# DELIBERATELY NOT DATABASE_URL, which .test-base blanks along with POSTGRES_URL,
# POSTGRESQL_URL and DB_URL: with any of those set, race-condition.test.ts opens
# a real connection and fails against a schema that does not exist. This name is
# inert to every test that does not ask for it.
#
# `vitest run postgres` is a filename filter, so a new *-postgres.test.ts file
# is picked up here without anyone remembering to add it.
test-backend-db:
  extends: .test-base
  services:
    - name: registry.hub.docker.com/library/postgres:17-alpine
      alias: postgres
  variables:
    # A fixed test constant, not a credential: the server is a throwaway
    # service container reachable only from this job, and it holds nothing but
    # fixtures this job seeds.
    POSTGRES_PASSWORD: "firsthand-ci-postgres-not-a-real-secret" # gitleaks:allow
    POSTGRES_USER: postgres
    POSTGRES_DB: postgres
    FIRSTHAND_TEST_DATABASE_URL: "postgres://postgres:firsthand-ci-postgres-not-a-real-secret@postgres:5432/postgres" # gitleaks:allow
    # Same opt-out as test-backend: MinIO needs a Docker daemon, a service
    # container will not do, and these runners have none.
    FIRSTHAND_SKIP_S3_TESTS: "1"
  script:
    - npm ci
    - cd backend && npm ci
    - npx vitest run postgres

test-frontend:
  extends: .test-base
  script:
    - npm ci
    - cd frontend && npm ci
    # `npm test` in frontend/ is bare `vitest`, which is watch mode. Vitest does
    # switch to a single run when it detects CI, but a job that hangs forever if
    # that detection ever changes is not worth the two saved characters.
    - npx vitest run

typecheck:
  extends: .test-base
  script:
    - npm ci
    - cd backend && npm ci
    - cd ../frontend && npm ci
    # Checks BOTH apps including their test files. The apps' own tsconfig.json
    # excludes tests so the builds stay lean, which meant nothing type-checked
    # them at all - a fixture naming a field that does not exist compiled, ran,
    # and reported green while asserting nothing. No other job runs tsc: the
    # kaniko builds do compile the source, but later in the pipeline and never
    # over the tests.
    - cd "$CI_PROJECT_DIR" && npm run typecheck

# Accessibility. axe-core over the pages in e2e/accessibility.test.ts, and the
# only Playwright job in this pipeline.
#
# Why it exists: seven of these tests failed for an unknown length of time
# without anyone noticing, because nothing here ran them. The brand terracotta
# #dd6e42 had spread into text roles where it measures 2.95-3.28 against the
# light surfaces, well under the 4.5 WCAG AA needs.
#
# It blocks. A contrast or ARIA regression is a defect in the product, not a
# warning about one, and a job that only warns is a job that gets ignored -
# which is the failure mode this whole thing is here to fix.
#
# No backend and no database. The spec stubs /api/me and /api/opportunities,
# every other call fails against the static server, and the pages under test
# render their empty and error states. What that costs, stated plainly: the
# data-populated states are NOT covered - a booking list, a populated admin
# table, a rendered survey. Those still need the local run against a seeded
# stack. What IS covered is everything the theme paints regardless of data,
# which is where every failure found so far has lived.
#
# The node image rather than mcr.microsoft.com/playwright: every other job in
# this file pulls through registry.hub.docker.com, so the browser is installed
# in the job instead. Swap the image for mcr.microsoft.com/playwright:v1.56.1-noble
# if that registry is ever allowed - it ships the browsers and the ~40s install
# below disappears. Bookworm rather than alpine because Playwright does not
# support musl.
test-a11y:
  extends: .test-base
  image: registry.hub.docker.com/library/node:20.20.2-bookworm
  script:
    - npm ci
    # No version argument: `npx playwright install` resolves the browser build
    # from the @playwright/test in package-lock.json. Naming a version here
    # would be a second place to bump, and a browser built for a different
    # Playwright fails with "Executable doesn't exist" - which reads as a
    # broken runner rather than a version skew.
    - npx playwright install --with-deps chromium
    - cd frontend && npm ci && npm run build
    # `vite preview` serves the build that was just produced, so the job tests
    # the bundle rather than the dev server's on-the-fly transform.
    - npx vite preview --port 3100 --strictPort &
    - |
      for i in $(seq 1 30); do
        curl -sf -o /dev/null http://localhost:3100/ && break
        [ "$i" = 30 ] && { echo "preview server never came up"; exit 1; }
        sleep 1
      done
    - cd "$CI_PROJECT_DIR"
    - BASE_URL=http://localhost:3100 npx playwright test --config=playwright.accessibility.config.ts
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/

test-scripts:
  extends: .test-base
  variables:
    # mutation-canary.integrity.test.js compares the working manifest against the
    # merge-base with origin/main (cto/AdaptaLabs#29). A shallow clone has no
    # common ancestor, so the merge-base cannot resolve and the live gate would
    # SKIP - which in CI it treats as a failure, by design. GIT_DEPTH:0 gives it
    # the history; the fetch below gives it the origin/main ref to merge-base
    # against. Same reason check-release-will-deploy sets GIT_DEPTH:0.
    GIT_DEPTH: 0
  before_script:
    # check-release-will-deploy.test.js and mutation-canary.integrity.test.js
    # both drive real git against throwaway repositories, and the node alpine
    # image has no git. Without this they fail with `spawnSync git ENOENT`,
    # which reads as broken tests rather than a missing binary.
    - apk add --no-cache git
    # The manifest-loss gate needs origin/main present to merge-base against.
    - git fetch --quiet origin main
  script:
    - npm ci
    # set-superadmin.test.js and role-scripts-tls.test.js spawn the real script
    # through backend/node_modules/.bin/tsx, so this job needs the backend tree
    # even though the tests themselves live at the root. Without it two of the
    # three files fail to load and the run reports 40 tests instead of 111 -
    # which looks like a smaller suite, not a broken one.
    - cd backend && npm ci
    - cd "$CI_PROJECT_DIR" && npm run test:scripts

# THE CURATED MUTATION CANARY - a manifest of load-bearing lines, each paired
# with the ONE test that must fail when that line changes.
#
# WHY IT BLOCKS A MERGE. The most expensive recurring defect in this repository
# is not wrong code; it is a test that CANNOT FAIL, where the fixture's natural
# shape already satisfies the property, so the assertion is decorative. On !210
# alone that happened five times and the fifth was inside the fix for the
# fourth - every one found by hand, late, by an expensive review gate. Mutation
# testing here was manual and ad hoc, which made the most valuable check the
# one most easily skipped when tired or busy.
#
# Not Stryker. Stryker over this codebase is hours, and hours is a job nobody
# blocks a merge on. It is a few minutes and grows with the manifest, so read
# a real job log for the total rather than trusting a number written down here
# - every count this comment has carried has gone stale within a fortnight.
#
# THE DATABASE SERVICE IS NOT OPTIONAL HERE. Several manifest entries are
# evaluated in exactly one place, and that place needs a real Postgres - the
# per-opportunity scope predicate, and the participant session-save attachment
# rules, where a mocked pg cannot raise a constraint at all. Collapsing that
# scope to a study-wide one hands one researcher every participant another
# recruited, and it passed 588 tests under the pipeline's old configuration.
# The runner REFUSES TO START rather than skip a database entry without
# FIRSTHAND_TEST_DATABASE_URL, because a skipped entry and a passing entry read
# identically in a green job. Grep the manifest for `needsDatabase` for the
# current set rather than trusting a count written down here.
#
# A GitLab `services:` container is not Docker-in-Docker: the executor provides
# it, so the `no-docker` runner tag does not forbid it. Same arrangement as
# test-backend-db above.
mutation-canary:
  extends: .test-base
  # THE PATH GATE. This job is the expensive one (~20 min: three npm ci, a
  # Postgres service, the full manifest). Anchors live under backend/,
  # shared/ AND frontend/ - the frontend ones arrived with the `project`
  # field, so a frontend-only MR can now change a mutation outcome and
  # frontend/ is gated here too (grep the manifest rather than trusting a
  # count - the last one written down drifted from 151 entries to 197). A
  # docs-only MR still skips the WHOLE job. Job-level and all-or-nothing on
  # purpose: never scope the run below the full manifest instead - a
  # filtered run is structurally blind to a pre-existing entry the same diff
  # broke, which is how !267 reddened main, and why the runner refuses a
  # filter flag (#53).
  #
  # MR + MERGE-TRAIN ONLY, not $PROD_REF. Both the MR pipeline and the
  # merge-train pipeline are `merge_request_event`, and the train runs the
  # FULL manifest against the actual merge result (main + this MR) in the
  # moments before it lands - so a post-merge run on main re-graded an
  # identical tree, and it did so ON THE DEPLOY CRITICAL PATH: measured on
  # !476, semantic-release and trigger-deployment-prod sat idle ~10 min
  # waiting for this job to finish on main, every deploy. It never guarded a
  # merge either - it runs after the merge, so it could only redden main
  # after the fact, which is exactly what the train run prevents by grading
  # the merge result first. Dropped here (Nick's call, this thread).
  #   DEPENDENCY: this now leans on merge trains being ON. If trains are ever
  #   disabled, restore `- if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'` below -
  #   without a train, an MR pipeline can go stale against an advanced main
  #   and nothing re-grades the real main tip. Keep this and the "CI waits"
  #   section of AGENTS.md in step.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "backend/**/*"
          - "frontend/**/*"
          - "shared/**/*"
          - "scripts/**/*"
          - "package.json"
          - "package-lock.json"
          - ".gitlab-ci.yml"
  services:
    - name: registry.hub.docker.com/library/postgres:17-alpine
      alias: postgres
  variables:
    # Fixed test constants, not credentials: the server is a throwaway service
    # container reachable only from this job, and no session this secret signs
    # outlives it.
    POSTGRES_PASSWORD: "firsthand-ci-postgres-not-a-real-secret" # gitleaks:allow
    POSTGRES_USER: postgres
    POSTGRES_DB: postgres
    FIRSTHAND_TEST_DATABASE_URL: "postgres://postgres:firsthand-ci-postgres-not-a-real-secret@postgres:5432/postgres" # gitleaks:allow
    SESSION_SECRET: "gitlab-ci-test-constant-not-a-real-secret" # gitleaks:allow
    FIRSTHAND_SKIP_S3_TESTS: "1"
  before_script:
    # The harness edits source files in place and refuses to start on a dirty
    # tree - and it decides that with `git status`. The node alpine image has
    # no git, which this file already says twice for test-scripts and
    # check-release-will-deploy. Without this the guard threw rather than
    # protecting anything, and before a review gate found it, the guard read a
    # missing git as a clean tree and said nothing at all.
    - apk add --no-cache git
  # SHARDED, cto/AdaptaLabs#77. Each of the four jobs runs one cell of a
  # deterministic partition (entries sorted by id, round-robin); the union is
  # the whole manifest and the merge gate is ALL shards green, so this is not
  # the filtered run ADR-0004 forbids - no entry is ever skipped, they are
  # spread. `parallel:` makes GitLab set CI_NODE_INDEX/CI_NODE_TOTAL itself, so
  # a mismatched pair cannot be typed here; if `parallel:` is ever removed,
  # both variables go unset, the empty values fail the runner's digit-only
  # check, and the job goes red rather than quietly running one full manifest.
  # The runner refuses a shard that selects nothing, so an oversized count
  # cannot delete coverage silently. Pick the count against runner capacity:
  # four queued shards serialise back to the old wall time.
  parallel: 4
  script:
    - npm ci
    - cd backend && npm ci
    - cd "$CI_PROJECT_DIR/frontend" && npm ci
    # `npm ci` writes nothing tracked, so the clean-tree guard is satisfied and
    # stays armed - it is what stops a run that died mid-mutation from being
    # mistaken for a passing one.
    - cd "$CI_PROJECT_DIR" && npm run test:canary -- --shard-index="$CI_NODE_INDEX" --shard-total="$CI_NODE_TOTAL"
