include:
  # Docker build component
  - component: "$CI_SERVER_FQDN/to-be-continuous/docker/gitlab-ci-docker@6.1"

  # semantic-release component
  - component: "$CI_SERVER_FQDN/to-be-continuous/semantic-release/gitlab-ci-semrel@3.11"
  
  # Congigures the above components and retrieve the necessary credentials from Secrets Manager
  - component: "$CI_SERVER_FQDN/to-be-continuous/kubera-init/gitlab-ci-kubera-init@1"

  - component: "$CI_SERVER_FQDN/to-be-continuous/gitleaks/gitlab-ci-gitleaks@2.9"
    
  # Kubera component
  - component: "$CI_SERVER_FQDN/to-be-continuous/kubera/gitlab-ci-kubera@1"
    inputs:
      # Optional. Defaults to the below example. Supported environments are playground and production.
      environments: >-
        [
          {"name":"playground","deploy_strategy":"auto"}
        ]
      multi-app: >-
        [
          {"subfolder":"$APP_1","app_name":"adaptalabs-backend","app_namespace":"adaptalabs"},
          {"subfolder":"$APP_2","app_name":"adaptalabs","app_namespace":"adaptalabs","depends_on":"$APP_1"}
        ]

      # Optional Branch Based Deployment input parameters
      # 1. Enable branch based deployment every time a commit is pushed to feature branch
      # defaults to false
      feat-deploy-on-push: "false"
      
      # 2. Enable branch based deployment every time a commit is pushed to an open MR source branch only
      # defaults to true
      feat-deploy-on-merge-request: "false"
      feat-deploy-on-push: "false"
      
      # 3. Enable cleanup of any leftover branch based deployments on merge
      # defaults to true
      feat-cleanup-on-merge: "true"

variables:
  APP_1: backend
  APP_2: frontend

.docker-base:
  parallel:
    matrix:
      - APP: "$APP_1"
        DOCKER_FILE: "$APP_1/Dockerfile"
        DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/$APP_1/snapshot:$CI_COMMIT_REF_SLUG"
        DOCKER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/$APP_1:$CI_COMMIT_REF_NAME"
        DOCKER_CONTEXT_PATH: "."
        DOCKER_BUILD_CACHE_DISABLED: "true"
      - APP: "$APP_2"
        DOCKER_FILE: "$APP_2/Dockerfile"
        DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/$APP_2/snapshot:$CI_COMMIT_REF_SLUG"
        DOCKER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/$APP_2:$CI_COMMIT_REF_NAME"
        DOCKER_CONTEXT_PATH: "."
        DOCKER_BUILD_CACHE_DISABLED: "true"
# Cap the advisory security_reports_gate (injected by the private kubera
# component - it is not defined in the public docker@6.1 template) at 5
# minutes instead of inheriting the 60-minute default. The gate is
# allow_failure on every pipeline, and its failure mode is a silent hang to
# the full job timeout while publish/deploy jobs queue behind it - observed
# even with every scan green (main pipeline for e2ca23d5, 2026-07-23: all
# scans passed, gate still burned 00:41->01:41 before timing out). Healthy
# gate runs complete in seconds, so 5m is generous headroom. Remove this
# override if/when the component's gate is fixed upstream.
# Catch a merge to main that changed deployed code but will not deploy it.
#
# Cortex ships by release tag: semantic-release cuts a version, that becomes the
# image tag, ArgoCD rolls it. semantic-release releases feat/fix/perf/revert and
# breaking changes ONLY - so a merge squashed as refactor:, docs:, chore:,
# style:, test: or build: cuts no version and never deploys, while every job
# here still reports success. MR !94 (2026-08-13) was exactly that: a
# user-visible rename squashed as `refactor:`, merged and undeployed behind a
# fully green pipeline, indistinguishable from a platform stall.
#
# Runs in .pre off the semantic-release-info dotenv, so it goes red about two
# minutes after the merge rather than whenever someone next looks at the site.
# GIT_DEPTH: 0 because the check diffs against the last release tag, which a
# shallow clone does not have.
check-release-will-deploy:
  stage: .pre
  image: registry.hub.docker.com/library/alpine:3.20
  needs:
    - job: semantic-release-info
      artifacts: true
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - sh ci/check-release-will-deploy.sh
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

security_reports_gate:
  timeout: 5m
