include:
  # Docker build component
  - component: "$CI_SERVER_FQDN/to-be-continuous/docker/gitlab-ci-docker@6.1"

  # semantic-release component
  - component: "$CI_SERVER_FQDN/to-be-continuous/semantic-release/gitlab-ci-semrel@3.11"
  
  # Congigures the above components and retrieve the necessary credentials from Secrets Manager
  - component: "$CI_SERVER_FQDN/to-be-continuous/kubera-init/gitlab-ci-kubera-init@1"

  - component: "$CI_SERVER_FQDN/to-be-continuous/gitleaks/gitlab-ci-gitleaks@2.9"
    
  # Kubera component
  - component: "$CI_SERVER_FQDN/to-be-continuous/kubera/gitlab-ci-kubera@1"
    inputs:
      # Optional. Defaults to the below example. Supported environments are playground and production.
      environments: >-
        [
          {"name":"playground","deploy_strategy":"auto"}
        ]
      multi-app: >-
        [
          {"subfolder":"$APP_1","app_name":"adaptalabs-backend","app_namespace":"adaptalabs"},
          {"subfolder":"$APP_2","app_name":"adaptalabs","app_namespace":"adaptalabs","depends_on":"$APP_1"}
        ]

      # Optional Branch Based Deployment input parameters
      # 1. Enable branch based deployment every time a commit is pushed to feature branch
      # defaults to false
      feat-deploy-on-push: "false"
      
      # 2. Enable branch based deployment every time a commit is pushed to an open MR source branch only
      # defaults to true
      feat-deploy-on-merge-request: "false"
      feat-deploy-on-push: "false"
      
      # 3. Enable cleanup of any leftover branch based deployments on merge
      # defaults to true
      feat-cleanup-on-merge: "true"

variables:
  APP_1: backend
  APP_2: frontend

.docker-base:
  parallel:
    matrix:
      - APP: "$APP_1"
        DOCKER_FILE: "$APP_1/Dockerfile"
        DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/$APP_1/snapshot:$CI_COMMIT_REF_SLUG"
        DOCKER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/$APP_1:$CI_COMMIT_REF_NAME"
        DOCKER_CONTEXT_PATH: "."
        DOCKER_BUILD_CACHE_DISABLED: "true"
      - APP: "$APP_2"
        DOCKER_FILE: "$APP_2/Dockerfile"
        DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/$APP_2/snapshot:$CI_COMMIT_REF_SLUG"
        DOCKER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/$APP_2:$CI_COMMIT_REF_NAME"
        DOCKER_CONTEXT_PATH: "."
        DOCKER_BUILD_CACHE_DISABLED: "true"
# Cap the advisory security_reports_gate (injected by the private kubera
# component - it is not defined in the public docker@6.1 template) at 5
# minutes instead of inheriting the 60-minute default. The gate is
# allow_failure on every pipeline, and its failure mode is a silent hang to
# the full job timeout while publish/deploy jobs queue behind it - observed
# even with every scan green (main pipeline for e2ca23d5, 2026-07-23: all
# scans passed, gate still burned 00:41->01:41 before timing out). Healthy
# gate runs complete in seconds, so 5m is generous headroom. Remove this
# override if/when the component's gate is fixed upstream.
# Catch a merge to main that changed deployed code but will not deploy it.
#
# Cortex ships by release tag: semantic-release cuts a version, that becomes the
# image tag, ArgoCD rolls it. semantic-release releases feat/fix/perf/revert and
# breaking changes ONLY - so a merge squashed as refactor:, docs:, chore:,
# style:, test: or build: cuts no version and never deploys, while every job
# here still reports success. MR !94 (2026-08-13) was exactly that: a
# user-visible rename squashed as `refactor:`, merged and undeployed behind a
# fully green pipeline, indistinguishable from a platform stall.
#
# Runs in .pre off the semantic-release-info dotenv, so it goes red about two
# minutes after the merge rather than whenever someone next looks at the site.
# GIT_DEPTH: 0 because the check diffs against the last release tag, which a
# shallow clone does not have.
check-release-will-deploy:
  stage: .pre
  image: registry.hub.docker.com/library/alpine:3.20
  needs:
    - job: semantic-release-info
      artifacts: true
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - sh ci/check-release-will-deploy.sh
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

security_reports_gate:
  timeout: 5m

# Lint. Nothing in this pipeline ran ESLint before, because ESLint was not
# installed - the frontend/.eslintrc.js that existed was inert.
#
# The rule policy lives in eslint.config.mjs at the repo root. Every rule is an
# error; the 396 pre-existing violations are recorded per file and per rule in
# eslint-suppressions.json. So a new violation fails even if someone fixed one
# somewhere else in the same change - which no aggregate count can do, however
# it is asserted - and ESLint also fails the run when a suppression stops being
# needed, which is what stops the record quietly drifting out of date. Run
# `npm run lint:prune` when it says so.
#
# Root `npm ci` only. The config uses the non-type-aware typescript-eslint
# preset, so parsing frontend/ and backend/ sources needs neither of their
# dependency trees installed.
#
# Image pinned exactly, and to the same Node the apps build on - matching
# backend/Dockerfile's own "bump deliberately, in git" standard.
lint:
  stage: .pre
  image: registry.hub.docker.com/library/node:20.20.2-alpine3.22
  needs: []
  interruptible: true
  script:
    - npm ci --ignore-scripts
    - npm run lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

# Tests. Until now this pipeline ran lint and nothing else, which is how the
# whole e2e suite came to collect zero tests from the initial commit onwards
# without anyone noticing. The unit and integration suites are the cheap part
# of the gate - no database, no stack, no seed data, and they mutate nothing -
# so they run in .pre alongside lint, and a red suite stops the pipeline before
# it spends anything on building images.
#
# Not covered here, deliberately: the e2e suite, which needs postgres and a
# seeded database, and three of whose specs create and publish studies.
#
# Image pinned to the same Node the apps build on, matching lint and
# backend/Dockerfile. Root `npm ci` comes first in every job: the suites import
# from shared/, whose dependencies (zod among them) resolve out of the root
# tree, and without it 13 backend suites fail to load.
.test-base:
  stage: .pre
  image: registry.hub.docker.com/library/node:20.20.2-alpine3.22
  needs: []
  interruptible: true
  variables:
    # The backend takes its connection string from the first of these four that
    # is set - see backend/src/config/databaseUrl.ts, where reading DATABASE_URL
    # alone is recorded as a proven landmine. Blank all four: with any of them
    # present, race-condition.test.ts opens a real connection and fails against
    # a schema that does not exist here. Empty string is falsy, so the resolver
    # falls through to undefined exactly as it does on a developer's machine.
    DATABASE_URL: ""
    POSTGRES_URL: ""
    POSTGRESQL_URL: ""
    DB_URL: ""
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

test-backend:
  extends: .test-base
  variables:
    # shared/config/environment.ts validates the environment at import time and
    # requires a session secret of at least 32 characters. Without one, 4 of the
    # 32 jest suites fail to load before running a single test. This is a fixed
    # test constant rather than a credential: no session it signs outlives the
    # job, and the deployed value comes from the Kubera secret store.
    SESSION_SECRET: "gitlab-ci-test-constant-not-a-real-secret" # gitleaks:allow
    # Two vitest files - runtime-object-storage-s3.test.ts and
    # s3-upload-integration.test.ts - start a real MinIO container and fail
    # loudly rather than silently skipping when Docker is absent. These runners
    # are tagged no-docker, which is why the image build uses kaniko, so there
    # is no daemon to give them. This is the opt-out those files document.
    #
    # What that costs, stated plainly: the S3 object-storage and direct-upload
    # integration paths are NOT covered by this job. They still run locally,
    # where Docker is available, and they are the same category as the e2e
    # suite - real infrastructure, not a unit test. 8 tests, reported as
    # skipped rather than passed, so the log never claims more than it ran.
    FIRSTHAND_SKIP_S3_TESTS: "1"
  script:
    - npm ci
    - cd backend && npm ci
    - npm test
    - npm run test:vitest

test-frontend:
  extends: .test-base
  script:
    - npm ci
    - cd frontend && npm ci
    # `npm test` in frontend/ is bare `vitest`, which is watch mode. Vitest does
    # switch to a single run when it detects CI, but a job that hangs forever if
    # that detection ever changes is not worth the two saved characters.
    - npx vitest run

typecheck:
  extends: .test-base
  script:
    - npm ci
    - cd backend && npm ci
    - cd ../frontend && npm ci
    # Checks BOTH apps including their test files. The apps' own tsconfig.json
    # excludes tests so the builds stay lean, which meant nothing type-checked
    # them at all - a fixture naming a field that does not exist compiled, ran,
    # and reported green while asserting nothing. No other job runs tsc: the
    # kaniko builds do compile the source, but later in the pipeline and never
    # over the tests.
    - cd "$CI_PROJECT_DIR" && npm run typecheck

test-scripts:
  extends: .test-base
  script:
    - npm ci
    # set-superadmin.test.js and role-scripts-tls.test.js spawn the real script
    # through backend/node_modules/.bin/tsx, so this job needs the backend tree
    # even though the tests themselves live at the root. Without it two of the
    # three files fail to load and the run reports 40 tests instead of 111 -
    # which looks like a smaller suite, not a broken one.
    - cd backend && npm ci
    - cd "$CI_PROJECT_DIR" && npm run test:scripts
