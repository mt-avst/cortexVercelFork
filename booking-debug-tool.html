<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Debug Tool</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; max-height: 300px; }
    </style>
</head>
<body>
    <h1>🔧 Booking Debug Tool</h1>
    
    <div class="section">
        <h2>1. Check Authentication</h2>
        <button onclick="checkAuth()">Check Auth Status</button>
        <div id="auth-result"></div>
    </div>
    
    <div class="section">
        <h2>2. Debug All Bookings</h2>
        <button onclick="debugBookings()">Show All Bookings (Including Cancelled)</button>
        <div id="debug-result"></div>
    </div>
    
    <div class="section">
        <h2>3. Check Active Bookings</h2>
        <button onclick="checkActiveBookings()">Show Only Active Bookings</button>
        <div id="active-result"></div>
    </div>
    
    <div class="section">
        <h2>4. Clean Up Cancelled Bookings</h2>
        <button onclick="cleanupCancelled()">Clean Up Cancelled Bookings</button>
        <div id="cleanup-result"></div>
    </div>
    
    <div class="section">
        <h2>5. Test Booking</h2>
        <button onclick="testBooking()">Try to Book a Session</button>
        <div id="booking-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001';
        
        async function checkAuth() {
            const resultDiv = document.getElementById('auth-result');
            resultDiv.innerHTML = '<div class="info">Checking authentication...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/me`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const user = await response.json();
                    resultDiv.innerHTML = `<div class="success">✅ Authenticated as: ${user.name} (${user.email})</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Not authenticated. Please login first.</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function debugBookings() {
            const resultDiv = document.getElementById('debug-result');
            resultDiv.innerHTML = '<div class="info">Fetching all bookings...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/bookings/my/bookings/debug`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="success">✅ Debug data retrieved</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const error = await response.text();
                    resultDiv.innerHTML = `<div class="error">❌ Failed: ${error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function checkActiveBookings() {
            const resultDiv = document.getElementById('active-result');
            resultDiv.innerHTML = '<div class="info">Fetching active bookings...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/my/bookings`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="success">✅ Active bookings retrieved</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const error = await response.text();
                    resultDiv.innerHTML = `<div class="error">❌ Failed: ${error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function cleanupCancelled() {
            const resultDiv = document.getElementById('cleanup-result');
            resultDiv.innerHTML = '<div class="info">Cleaning up cancelled bookings...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/bookings/cleanup-cancelled`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="success">✅ Cleanup completed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const error = await response.text();
                    resultDiv.innerHTML = `<div class="error">❌ Cleanup failed: ${error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function testBooking() {
            const resultDiv = document.getElementById('booking-result');
            resultDiv.innerHTML = '<div class="info">Testing session booking...</div>';
            
            try {
                // First get available sessions
                const sessionsResponse = await fetch(`${API_BASE}/api/opportunities`, {
                    credentials: 'include'
                });
                
                if (!sessionsResponse.ok) {
                    resultDiv.innerHTML = `<div class="error">❌ Failed to get opportunities: ${sessionsResponse.status}</div>`;
                    return;
                }
                
                const opportunities = await sessionsResponse.json();
                const opportunityWithSessions = opportunities.find(opp => opp.sessions && opp.sessions.length > 0);
                
                if (!opportunityWithSessions) {
                    resultDiv.innerHTML = `<div class="error">❌ No opportunities with sessions found</div>`;
                    return;
                }
                
                const availableSession = opportunityWithSessions.sessions.find(s => s.remaining > 0);
                
                if (!availableSession) {
                    resultDiv.innerHTML = `<div class="error">❌ No available sessions found</div>`;
                    return;
                }
                
                // Try to book the session
                const bookingResponse = await fetch(`${API_BASE}/api/bookings/sessions/${availableSession.id}/book`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (bookingResponse.ok) {
                    const booking = await bookingResponse.json();
                    resultDiv.innerHTML = `
                        <div class="success">✅ Booking successful!</div>
                        <pre>${JSON.stringify(booking, null, 2)}</pre>
                    `;
                } else {
                    const error = await bookingResponse.text();
                    resultDiv.innerHTML = `<div class="error">❌ Booking failed: ${error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        // Auto-check auth on page load
        window.onload = function() {
            checkAuth();
        };
    </script>
</body>
</html>
